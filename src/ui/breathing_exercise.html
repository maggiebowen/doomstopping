<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Orb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* Rely on python window transparency or fake it */
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Hint that interaction is possible */
        }

        .overlay-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            /* Darkening layer */
            backdrop-filter: blur(15px);
            /* Blur if supported by windowing context */
            z-index: 0;
        }

        .orb-container {
            position: relative;
            z-index: 10;
            width: 380px;
            /* Base size ~380px */
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 4s infinite ease-in-out;
        }

        @media (max-height: 800px) {
            .orb-container {
                width: 320px;
                height: 320px;
            }
        }

        @keyframes breathe {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1.0;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        .orb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                    rgba(255, 100, 100, 0.8),
                    rgba(255, 150, 200, 0.6),
                    rgba(150, 100, 255, 0.4),
                    rgba(100, 150, 255, 0.2));
            box-shadow: 0 0 60px rgba(255, 150, 200, 0.4);
            filter: blur(10px);
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0.15;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            mix-blend-mode: overlay;
        }

        .content-text {
            position: relative;
            z-index: 20;
            text-align: center;
            font-weight: 300;
            font-size: 1.5rem;
            max-width: 80%;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            /* Passes click through to body */
        }

        .visible {
            opacity: 1;
        }

        .click-hint {
            position: absolute;
            bottom: 20%;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s ease;
            color: rgba(255, 255, 255, 0.7);
        }

        .visible-hint {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="overlay-bg"></div>

    <div class="orb-container">
        <div class="orb"></div>
        <div class="noise"></div>
        <div class="content-text" id="mainText"></div>
    </div>

    <div class="click-hint" id="clickHint">(Click to continue)</div>

    <script>
        const sequence = [
            // Interactive Intro (waitForClick: true)
            { text: "You asked me to remind you to take a break when you feel distressed.", waitForClick: true },
            { text: "Your facial expressions and physiological signals indicate you are distressed.", waitForClick: true },
            { text: "Let's do a breathing exercise together to relax.", waitForClick: true },

            // Meditation (Auto flow)
            { text: "Breathing in, I know I am breathing in.", duration: 6000 },
            { text: "Breathing out, I know I am breathing out.", duration: 6000 },
            { text: "In…", duration: 5000 },
            { text: "Out…", duration: 5000 },

            { text: "Breathing in, I become aware of my body.", duration: 5000 },
            { text: "Breathing out, I release any tension.", duration: 5000 },
            { text: "Aware of body…", duration: 5000 },
            { text: "Releasing tension…", duration: 5000 },

            { text: "Breathing in, I arrive in this present moment.", duration: 6000 },
            { text: "Breathing out, I feel at home in the here and now.", duration: 6000 },
            { text: "Arriving…", duration: 5000 },
            { text: "Home…", duration: 5000 },

            { text: "Breathing in, I calm my mind.", duration: 6000 },
            { text: "Breathing out, I let go of all worries.", duration: 6000 },
            { text: "Calm…", duration: 5000 },
            { text: "Letting go…", duration: 5000 }
        ];

        const textElement = document.getElementById('mainText');
        const hintElement = document.getElementById('clickHint');
        let currentIndex = 0;
        let isWaitingForClick = false;

        function showNext() {
            if (currentIndex >= sequence.length) {
                // End of sequence. Fade out text.
                textElement.classList.remove('visible');
                hintElement.classList.remove('visible-hint');
                return;
            }

            const item = sequence[currentIndex];

            // Fade Out
            textElement.classList.remove('visible');
            hintElement.classList.remove('visible-hint');

            // Wait/Swap
            setTimeout(() => {
                textElement.innerText = item.text;
                textElement.classList.add('visible');

                if (item.waitForClick) {
                    isWaitingForClick = true;
                    hintElement.classList.add('visible-hint'); // Show hint
                    // Logic handles click listener below
                } else {
                    isWaitingForClick = false;
                    // Schedule next auto
                    currentIndex++;
                    setTimeout(showNext, item.duration);
                }

            }, 500);
        }

        // Click Logic
        document.body.addEventListener('click', () => {
            if (isWaitingForClick) {
                // User clicked, proceed
                isWaitingForClick = false;
                currentIndex++;
                showNext();
            }
        });

        // Start delay
        setTimeout(showNext, 1000);

    </script>
</body>

</html>
